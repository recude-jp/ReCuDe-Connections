<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>RecudeMatch</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // 前回表示したテナントのアイコン(ファビコン)とサービス名を、アプリが起動する前に反映する
    // (アプリがテナントの設定を読み込むまで、既定のアイコンが出ないように)。FaviconService が保存する。
    try {
      var saved = JSON.parse(localStorage.getItem('recude.branding') || 'null');
      if (saved && saved.icon) {
        document.querySelectorAll('link[rel="icon"]').forEach(function (l) { l.remove(); });
        ['icon', 'apple-touch-icon'].forEach(function (rel) {
          var link = document.createElement('link');
          link.rel = rel;
          link.type = 'image/png';
          link.href = saved.icon;
          document.head.appendChild(link);
        });
      }
      if (saved && saved.title) {
        document.title = saved.title;
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
