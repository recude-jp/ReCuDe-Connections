<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>TOKYO GIFU CONNECT</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- LINE・SNS・検索結果のリンクプレビュー(JavaScriptを実行しないので、ここに静的に書く)。 -->
  <meta name="description" content="会員の紹介でしか入れない、岐阜にゆかりのある人だけのコミュニティ。知らない誰かとつながるSNSではなく、信頼の輪の中で、一生ものの仲間と人脈を。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TOKYO GIFU CONNECT">
  <meta property="og:title" content="TOKYO GIFU CONNECT｜ふるさと岐阜が、東京での本当のつながりをつくる。">
  <meta property="og:description" content="会員の紹介でしか入れない、岐阜にゆかりのある人だけのコミュニティ。東京岐阜県人会の会員ネットワークです。">
  <meta property="og:url" content="https://connect.apgifu.org/">
  <meta property="og:image" content="https://connect.apgifu.org/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="TOKYO GIFU CONNECT">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // 前回表示したテナントのアイコン(ファビコン)とサービス名を、アプリが起動する前に反映する
    // (アプリがテナントの設定を読み込むまで、既定のアイコンが出ないように)。FaviconService が保存する。
    try {
      var saved = JSON.parse(localStorage.getItem('recude.branding') || 'null');
      if (saved && saved.icon) {
        document.querySelectorAll('link[rel="icon"]').forEach(function (l) { l.remove(); });
        ['icon', 'apple-touch-icon'].forEach(function (rel) {
          var link = document.createElement('link');
          link.rel = rel;
          link.type = 'image/png';
          link.href = saved.icon;
          document.head.appendChild(link);
        });
      }
      if (saved && saved.title) {
        document.title = saved.title;
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>TOKYO GIFU CONNECT をご利用いただくには、ブラウザの JavaScript を有効にしてください。</noscript>
</body>
</html>
